name: Build runner image

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: pip install -r runner_wrapper/requirements-test.txt
      - run: python -m unittest discover -s runner_wrapper/tests -v

  docker:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check release belongs to main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Set image name
        id: image
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          [[ "${repository#*/}" == scenegendeploybench-* ]]
          echo "name=ghcr.io/${repository}" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: runner_wrapper/Dockerfile
          push: ${{ github.ref_type == 'tag' }}
          build-args: MAX_JOBS=2
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=matrix3d
          cache-to: type=gha,mode=min,ignore-error=true,scope=matrix3d
