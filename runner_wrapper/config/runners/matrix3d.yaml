catalog_version: 1

runners:
  - runner: matrix3d-panorama-5b-opt
    version: 0.1.0
    latest: true
    display_name: Matrix-3D panorama 5B 720p Opt
    kind: generator
    contract_version: 1
    inputs: &inputs
      data:
        required_sample:
          required_datatype: [image]
    job_parameters: &parameters
      prompt: a realistic scene
      seed: 0
      angle: 0.0
      movement_range: 0.6
      movement_mode: straight
      video_steps: 50
      gs_iterations: 3000
    scheduling: &scheduling
      max_batch_size: 1
      max_attempts: 1
      job_timeout_minutes: 720
      startup_timeout_minutes: 5
    launcher: &launcher
      driver: docker
      compat_version: 1
      image: ghcr.io/cashewhero/scenegendeploybench-matrix-3d:0.1.0
      endpoint:
        port: 58090
      gpus: 1
      env: &environment
        MATRIX3D_VIDEO_MODEL: 5b-720p
        MATRIX3D_VRAM_MANAGEMENT: "0"
        MATRIX3D_AUTO_DOWNLOAD_WEIGHTS: "1"
        MATRIX3D_MODEL_CACHE_NAMESPACE: matrix3d
      env_passthrough: [HF_TOKEN]

  - runner: matrix3d-panorama-14b720-opt
    version: 0.1.0
    latest: true
    display_name: Matrix-3D panorama 14B 720p Opt
    kind: generator
    contract_version: 1
    inputs: *inputs
    job_parameters: *parameters
    scheduling: *scheduling
    launcher:
      <<: *launcher
      env:
        <<: *environment
        MATRIX3D_VIDEO_MODEL: 14b-720p
        MATRIX3D_VRAM_MANAGEMENT: "1"

  - runner: matrix3d-panorama-14b480-opt
    version: 0.1.0
    latest: true
    display_name: Matrix-3D panorama 14B 480p Opt
    kind: generator
    contract_version: 1
    inputs: *inputs
    job_parameters: *parameters
    scheduling: *scheduling
    launcher:
      <<: *launcher
      env:
        <<: *environment
        MATRIX3D_VIDEO_MODEL: 14b-480p
        MATRIX3D_VRAM_MANAGEMENT: "1"
